<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — Medix QR</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
  .auth-box { width: 100%; max-width: 440px; }
  .auth-logo { font-size: 1.5rem; font-weight: 800; color: var(--teal); text-align: center; margin-bottom: 0.3rem; }
  .auth-logo span { color: var(--navy); }
  .auth-tagline { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .switch-link { text-align: center; font-size: 0.85rem; color: var(--text2); margin-top: 1.2rem; }
  .switch-link a { color: var(--teal); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="auth-box">
  <div class="auth-logo">Medix<span>QR</span></div>
  <div class="auth-tagline">Create your free account in seconds</div>

  <div class="card">
    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" class="form-control" placeholder="Akash Singh"/>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="form-control" placeholder="Min. 6 characters"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm" class="form-control" placeholder="Re-enter password"/>
    </div>

    <button class="btn btn-primary btn-full" id="reg-btn" onclick="handleRegister()">
      <span id="btn-text">Create Account</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <div class="switch-link">
    Already have an account? <a href="/pages/login.html">Sign in</a>
  </div>
  <div class="switch-link mt-1">
    <a href="/pages/index.html">← Back to Home</a>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  requireGuest();

  async function handleRegister() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn      = document.getElementById('reg-btn');
    const spinner  = document.getElementById('spinner');
    const btnText  = document.getElementById('btn-text');

    if (!name || !email || !password || !confirm) return showAlert('alert', 'All fields are required');
    if (password !== confirm) return showAlert('alert', 'Passwords do not match');
    if (password.length < 6)  return showAlert('alert', 'Password must be at least 6 characters');

    btn.disabled = true;
    spinner.classList.add('show');
    btnText.textContent = 'Creating account...';

    try {
      const data = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name, email, password })
      });
      saveAuth(data.token, data.user);
      window.location.href = '/pages/dashboard.html';
    } catch (err) {
      showAlert('alert', err.message);
    } finally {
      btn.disabled = false;
      spinner.classList.remove('show');
      btnText.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
